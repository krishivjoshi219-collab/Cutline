name: Build Fire TV APK

on:
  push:
    branches: [main]
    paths:
      - 'cutline-rn/**'
      - '.github/workflows/build-firetv-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cutline-rn/**'
  workflow_dispatch:

env:
  # Force single SDK path — prevents the ANDROID_HOME vs ANDROID_SDK_ROOT conflict
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    name: Build Fire TV APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 ───────────────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node 20 ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: cutline-rn/package.json

      # ── 4. Accept Android SDK licenses (write hash files) ─────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >  /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" >  /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" >  /usr/local/lib/android/sdk/licenses/google-gdk-license

      # ── 5. Install npm dependencies ───────────────────────────────────────
      - name: Install dependencies
        working-directory: cutline-rn
        run: npm install

      # ── 6. Expo prebuild → generates android/ ─────────────────────────────
      - name: Expo prebuild (Android)
        working-directory: cutline-rn
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_NO_TELEMETRY: 1

      # ── 7. Fix local.properties with correct SDK path ─────────────────────
      # Expo prebuild may write a wrong sdk.dir — override it
      - name: Fix local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > cutline-rn/android/local.properties
          cat cutline-rn/android/local.properties

      # ── 8. Ensure splashscreen color resource exists ──────────────────────
      - name: Ensure splashscreen color resource exists
        run: |
          mkdir -p cutline-rn/android/app/src/main/res/values
          COLORS_FILE="cutline-rn/android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_FILE" ]; then
            if ! grep -q "splashscreen_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="splashscreen_background">#0A0D14</color>\n</resources>|' "$COLORS_FILE"
            fi
          else
            echo '<resources>' > "$COLORS_FILE"
            echo '    <color name="splashscreen_background">#0A0D14</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          fi
          cat "$COLORS_FILE"

      # ── 9. Make gradlew executable ────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x cutline-rn/android/gradlew

      # ── 10. Enable standalone offline bundling in APK ─────────────────────
      - name: Enable standalone offline bundling
        run: |
          BUILD_GRADLE="cutline-rn/android/app/build.gradle"
          if grep -q "react {" "$BUILD_GRADLE"; then
            sed -i 's/react {/react {\n    debuggableVariants = []/' "$BUILD_GRADLE"
          fi
          echo "=== Patched react configuration in build.gradle ==="
          grep -A 8 "react {" "$BUILD_GRADLE" || true

      # ── 11. Cache Gradle ──────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('cutline-rn/android/**/*.gradle*', 'cutline-rn/android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 12. Build standalone APKs ─────────────────────────────────────────
      - name: Build Standalone APKs
        working-directory: cutline-rn/android
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # ── 13. Upload APK artifact ───────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-firetv-apk
          path: cutline-rn/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      # ── 14. Build Vega OS Package (.vpkg) ─────────────────────────────────
      - name: Build Vega OS Package (.vpkg)
        run: |
          chmod +x cutline-rn/scripts/build-vpkg.sh
          ./cutline-rn/scripts/build-vpkg.sh

      # ── 15. Upload Vega OS .vpkg artifact ─────────────────────────────────
      - name: Upload Vega OS .vpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-vegaos-vpkg
          path: cutline-firetv-v0.1.0.vpkg
          retention-days: 30

      # ── 16. Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "## ✅ Fire TV APK & Vega OS Package Built!" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Actions → this run → Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Android / Fire OS**: \`cutline-firetv-apk\` (includes standalone APK with bundled JS)" >> $GITHUB_STEP_SUMMARY
          echo "- **Amazon Vega OS**: \`cutline-vegaos-vpkg\` (\`.vpkg\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sideload on Fire TV" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "adb connect <firetv-ip>:5555" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "# Or release build:" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-release.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
