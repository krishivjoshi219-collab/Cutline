name: Build Fire TV APK

on:
  push:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'index.js'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'manifest.toml'
      - '.github/workflows/build-firetv-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'App.tsx'
      - 'index.js'
      - 'src/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'metro.config.js'
      - 'babel.config.js'
      - 'tsconfig.json'
      - 'scripts/**'
      - 'manifest.toml'
      - '.github/workflows/build-firetv-apk.yml'
  workflow_dispatch:

env:
  # Force single SDK path — prevents the ANDROID_HOME vs ANDROID_SDK_ROOT conflict
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  EXPO_NO_TELEMETRY: 1

jobs:
  build-apk:
    name: Build Fire TV APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 17 (required by React Native 0.74 / Gradle) ───────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Node 20 ───────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # ── 4. Accept Android SDK licenses (write hash files) ─────────────────
      - name: Accept Android SDK licenses
        run: |
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >  /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo "504667f4c0de7af1a06de9f4b1727b84351f2910" >  /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          echo "33b6a2b64607f11b759f320ef9dff4ae5c47d97a" >  /usr/local/lib/android/sdk/licenses/google-gdk-license

      # ── 5. Install npm dependencies ───────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Typecheck (fail fast before native build) ─────────────────────
      - name: Typecheck
        run: npm run tsc

      # ── 7. Expo prebuild → generates android/ ─────────────────────────────
      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      # ── 8. Fix local.properties with correct SDK path ─────────────────────
      # Expo prebuild may write a wrong sdk.dir — override it
      - name: Fix local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          cat android/local.properties

      # ── 9. Ensure splashscreen color resource exists ──────────────────────
      - name: Ensure splashscreen color resource exists
        run: |
          mkdir -p android/app/src/main/res/values
          COLORS_FILE="android/app/src/main/res/values/colors.xml"
          if [ -f "$COLORS_FILE" ]; then
            if ! grep -q "splashscreen_background" "$COLORS_FILE"; then
              sed -i 's|</resources>|    <color name="splashscreen_background">#0A0D14</color>\n</resources>|' "$COLORS_FILE"
            fi
          else
            echo '<resources>' > "$COLORS_FILE"
            echo '    <color name="splashscreen_background">#0A0D14</color>' >> "$COLORS_FILE"
            echo '</resources>' >> "$COLORS_FILE"
          fi
          cat "$COLORS_FILE"

      # ── 10. Make gradlew executable ───────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── 11. Enable standalone offline bundling in APK ─────────────────────
      # Empty debuggableVariants makes even debug builds carry their own
      # bundled JS (Hermes) instead of loading from the Metro dev server,
      # so the sideloaded APK runs offline on Fire TV. Release builds always
      # bundle via the bundleReleaseJsAndAssets Gradle task.
      - name: Enable standalone offline bundling
        run: |
          BUILD_GRADLE="android/app/build.gradle"
          if grep -q "react {" "$BUILD_GRADLE"; then
            sed -i 's/react {/react {\n    debuggableVariants = []/' "$BUILD_GRADLE"
          fi
          echo "=== Patched react configuration in build.gradle ==="
          grep -A 8 "react {" "$BUILD_GRADLE" || true

      # ── 12. Cache Gradle ──────────────────────────────────────────────────
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # ── 13. Build APKs (debug + prod release) ─────────────────────────────
      # Both are required: a failing release must fail the job, not be
      # swallowed. assembleRelease runs the native JS bundling pipeline
      # (react-native bundle + Hermes bytecode) via bundleReleaseJsAndAssets.
      # NOTE: the release APK is unsigned without a keystore — fine for
      # verifying the prod bundle in CI; sign it before store distribution.
      - name: Build APKs
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      # ── 14. Upload APK artifacts ──────────────────────────────────────────
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-firetv-apk-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-firetv-apk-release
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── 15. Build Vega OS Package (.vpkg) ─────────────────────────────────
      - name: Build Vega OS Package (.vpkg)
        run: |
          chmod +x scripts/build-vpkg.sh
          ./scripts/build-vpkg.sh

      # ── 16. Upload Vega OS .vpkg artifact ─────────────────────────────────
      - name: Upload Vega OS .vpkg artifact
        uses: actions/upload-artifact@v4
        with:
          name: cutline-vegaos-vpkg
          path: cutline-firetv-v0.1.0.vpkg
          retention-days: 30

      # ── 17. Summary ───────────────────────────────────────────────────────
      - name: Build Summary
        run: |
          echo "## ✅ Fire TV APK & Vega OS Package Built!" >> $GITHUB_STEP_SUMMARY
          echo "Download from **Actions → this run → Artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Android / Fire OS (debug, sideload-ready)**: \`cutline-firetv-apk-debug\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Android / Fire OS (prod release, unsigned)**: \`cutline-firetv-apk-release\` — sign before store distribution" >> $GITHUB_STEP_SUMMARY
          echo "- **Amazon Vega OS**: \`cutline-vegaos-vpkg\` (\`.vpkg\`)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Sideload on Fire TV" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "adb connect <firetv-ip>:5555" >> $GITHUB_STEP_SUMMARY
          echo "adb install app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
