name: android-apk

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cutline-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: cutline-rn/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - run: npm install --no-audit --no-fund
      - run: npm run tsc --if-present
      - run: npx expo prebuild --platform android --clean --non-interactive
      - run: ./gradlew -p android assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cutline-debug-apk
          path: cutline-rn/android/app/build/outputs/apk/debug/app-debug.apk
